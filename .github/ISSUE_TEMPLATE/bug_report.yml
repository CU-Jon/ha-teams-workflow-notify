name: Bug report
description: Report reproducible integration behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Never include a workflow URL or token. Review diagnostics and logs before
        attaching them.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.7.4
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: run_history
    attributes:
      label: Did a Power Automate run start?
      options:
        - "Yes"
        - "No"
        - "Not checked"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      description: Remove URLs, tokens, tenant details, and personal information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed all workflow URLs and tokens from this report.
          required: true
        - label: I searched existing issues and tested the latest release.
          required: true
