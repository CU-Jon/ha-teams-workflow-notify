send_card:
  target:
    entity:
      domain: notify
      integration: teams_workflow_notify
  fields:
    title:
      example: Garage Door
      selector:
        text:
    message:
      required: true
      example: Garage has been open for 20 minutes.
      selector:
        text:
          multiline: true
    subtitle:
      example: Home Assistant
      selector:
        text:
    severity:
      default: default
      selector:
        select:
          translation_key: severity
          options:
            - default
            - info
            - success
            - warning
            - error
    facts:
      example:
        - title: Entity
          value: cover.garage_door
        - title: Time
          value: 10:42 PM
      selector:
        object:
    actions:
      example:
        - title: Open Home Assistant
          url: https://ha.example.com/lovelace/security
      selector:
        object:
    image_url:
      example: /local/snapshots/front-door.jpg
      selector:
        text:
          multiline: true
    image_delivery:
      default: auto
      selector:
        select:
          translation_key: image_delivery
          options:
            - auto
            - url
            - inline
    image_alt_text:
      example: Front door camera snapshot
      selector:
        text:
